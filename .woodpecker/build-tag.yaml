when:
  - event: tag
    branch: main

steps:
  - name: build
    image: golang:latest
    commands:
      - GOOS=linux GOARCH=amd64 go build -o gtl-linux-amd64
      - GOOS=freebsd GOARCH=amd64 go build -o gtl-freebsd-amd64
      - GOOS=openbsd GOARCH=amd64 go build -o gtl-openbsd-amd64
      - GOOS=netbsd GOARCH=amd64 go build -o gtl-netbsd-amd64
      - GOOS=linux GOARCH=arm64 go build -o gtl-linux-arm64
      - GOOS=freebsd GOARCH=arm64 go build -o gtl-freebsd-arm64
      - GOOS=openbsd GOARCH=arm64 go build -o gtl-openbsd-arm64
      - GOOS=netbsd GOARCH=arm64 go build -o gtl-netbsd-arm64
  - name: publish
    depends_on: build
    image: woodpeckerci/plugin-release
    settings:
      files:
        - gtl-*

